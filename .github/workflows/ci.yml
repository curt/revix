name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.3"

jobs:
  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm

    services:
      postgres:
        image: ghcr.io/curt/postgis:18-3.6-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: revix
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: revix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      POSTGRES_PASSWORD: ci_password
      POSTGRES_PORT: "5432"
      # Same static key used in config/test.exs — already public in the repo
      CLOAK_KEY: "a9KFQ/0sX7+VUMTqfECbNlp8e3GAXGZ8OqnOV8rQxDI="

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix deps cache
        uses: actions/cache@v4
        id: mix-cache
        with:
          path: deps
          key: ${{ runner.os }}-${{ runner.arch }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Restore _build cache
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-build-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --fix-missing imagemagick

      - name: Install Mix dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile app (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run Elixir tests with coverage
        run: mix coveralls.github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

      - name: Restore npm cache
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: assets/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('assets/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-

      - name: Install npm packages
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix assets

      - name: Run JavaScript tests
        run: npm test --prefix assets

  docker:
    name: Build and push Docker image
    needs: test
    if: github.event_name == 'push' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
